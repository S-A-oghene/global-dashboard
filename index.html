<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Global Insight Dashboard: Real-time news headlines and currency exchange rates for countries worldwide.">
    <meta name="keywords" content="news, currency, exchange rates, global news, forex">
    <meta name="author" content="Global Insight">
    <meta name="theme-color" content="#2563eb">
    <title>Global Insight | Real-time News & Currency Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="container header-content">
            <h1 class="app-title">🌍 Global Insight</h1>
            <p class="app-subtitle">Real-time News & Currency Exchange</p>
        </div>
    </header>

    <main class="container main-content">
        <section class="controls-section">
            <label for="country-select" class="country-label">Select Country:</label>
            <select id="country-select" class="country-select"
                aria-label="Select a country to view news and exchange rates"></select>
        </section>

        <section class="dashboard-grid">
            <div class="news-panel">
                <h2 class="section-title">Latest Headlines</h2>
                <div id="news-container" class="news-container">
                    <p class="loading-message">Fetching headlines...</p>
                </div>
            </div>

            <aside class="currency-panel">
                <h2 class="section-title">Market Watch</h2>
                <div id="currency-info" class="currency-info">
                    <p class="loading-message">Updating rates...</p>
                </div>
            </aside>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2026 Global Insight. All rights reserved.</p>
            <p>Powered by <a href="https://gnews.io/" target="_blank" rel="noopener noreferrer">GNews API</a> &amp; <a
                    href="https://www.frankfurter.app/" target="_blank" rel="noopener noreferrer">Frankfurter API</a>
            </p>
        </div>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>

</html>
